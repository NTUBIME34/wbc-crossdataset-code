# Cellpose environment (Supplementary Table S5 and Section S6): Python 3.12.12, Cellpose 4.1.1
# with the Cellpose-SAM (`cpsam`) model, PyTorch 2.5.1 (CUDA 12.1). Used only by
# data_prep/cellpose_crop.py, which makes the Cellpose crops of routes C and D
# (eval/run_routes_ablation.sh reads them). Cellpose downloads the cpsam weights on first use.
#
# Exported from the authors' environment with `conda env export --no-builds`; every package
# was installed before the paper's Cellpose crops were made.
#
# Create with:  conda env create -f environment/cellpose_env.yml
# CPU-only machine: replace the index URL by https://download.pytorch.org/whl/cpu and the
# +cu121 suffixes by +cpu.
name: cellpose_env
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - bzip2=1.0.8
  - ca-certificates=2026.3.19
  - expat=2.8.0
  - ld_impl_linux-64=2.44
  - libexpat=2.8.0
  - libffi=3.4.8
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libnsl=2.0.0
  - libstdcxx=15.2.0
  - libuuid=1.41.5
  - libxcb=1.17.0
  - libzlib=1.3.1
  - ncurses=6.5
  - openssl=3.5.6
  - packaging=26.0
  - pip=26.0.1
  - pthread-stubs=0.3
  - python=3.12.12
  - readline=8.3
  - setuptools=82.0.1
  - sqlite=3.51.2
  - tk=8.6.15
  - tzdata=2026a
  - wheel=0.46.3
  - xorg-libx11=1.8.12
  - xorg-libxau=1.0.12
  - xorg-libxdmcp=1.1.5
  - xorg-xorgproto=2024.1
  - xz=5.8.2
  - zlib=1.3.1
  - pip:
      # PyTorch's +cu121 builds are published on PyTorch's own wheel index, not on PyPI.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - cellpose==4.1.1
      - fastremap==1.19.0
      - filelock==3.29.0
      - fill-voids==2.1.2
      - fsspec==2026.4.0
      - imagecodecs==2026.5.10
      - jinja2==3.1.6
      - markupsafe==3.0.3
      - mpmath==1.3.0
      - natsort==8.4.0
      - networkx==3.6.1
      - numpy==2.4.4
      - nvidia-cublas-cu12==12.1.3.1
      - nvidia-cuda-cupti-cu12==12.1.105
      - nvidia-cuda-nvrtc-cu12==12.1.105
      - nvidia-cuda-runtime-cu12==12.1.105
      - nvidia-cudnn-cu12==9.1.0.70
      - nvidia-cufft-cu12==11.0.2.54
      - nvidia-curand-cu12==10.3.2.106
      - nvidia-cusolver-cu12==11.4.5.107
      - nvidia-cusparse-cu12==12.1.0.106
      - nvidia-nccl-cu12==2.21.5
      - nvidia-nvjitlink-cu12==12.9.86
      - nvidia-nvtx-cu12==12.1.105
      - opencv-python==4.13.0.92
      - opencv-python-headless==4.13.0.92
      - pillow==12.2.0
      - roifile==2026.2.10
      - scipy==1.17.1
      - segment-anything==1.0
      - sympy==1.13.1
      - tifffile==2026.5.15
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - tqdm==4.67.3
      - triton==3.1.0
      - typing-extensions==4.15.0
